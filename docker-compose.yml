services:
  app:
    build: .
    image: kr2-app:1.0
    restart: unless-stopped

    ports:
      - "127.0.0.1:8001:8001"

    environment:
      REDIS_HOST: redis
      STUDENT: Isakov

    env_file:
      - .env

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is not set}

    env_file:
      - .env

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

    volumes:
      - redis_data:/data

    networks:
      - backend

volumes:
  redis_data:

networks:
  backend:
    driver: bridge
